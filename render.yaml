# Blueprint do Render para o Informativo (serviço "CentralInformativo").
# No painel do Render: New + > Blueprint > selecione este repositório.
# Depois defina INFORMATIVO_ADMIN_PASSWORD (marcada como "sync: false").
services:
  - type: web
    # Nome do serviço no Render = subdomínio da URL pública.
    # "informativo" já está em uso, então usamos "CentralInformativo"
    # (a marca do produto continua sendo "Informativo").
    name: CentralInformativo
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt && pip install ."
    startCommand: "gunicorn wsgi:app --bind 0.0.0.0:$PORT --workers 1 --threads 4"
    envVars:
      # Chave de sessão gerada e mantida pelo Render.
      - key: INFORMATIVO_SECRET_KEY
        generateValue: true
      # Usuário admin criado automaticamente na primeira subida.
      - key: INFORMATIVO_ADMIN_USERNAME
        value: admin
      # Defina no painel do Render (não fica versionada).
      - key: INFORMATIVO_ADMIN_PASSWORD
        sync: false
      # Banco SQLite. No plano free o disco é efêmero (ver README).
      - key: INFORMATIVO_DSN
        value: "sqlite:///output/informativo.db"
      - key: PYTHON_VERSION
        value: "3.12.6"

    # --- Persistência (opcional, requer plano pago) -----------------------
    # Para não perder fontes/usuários/tema a cada deploy, use um disco e
    # aponte o DSN para ele. Descomente e troque o plano para "starter":
    #
    # plan: starter
    # disk:
    #   name: informativo-data
    #   mountPath: /var/data
    #   sizeGB: 1
    # e altere INFORMATIVO_DSN para "sqlite:////var/data/informativo.db"
    # (quatro barras = caminho absoluto /var/data/informativo.db).
