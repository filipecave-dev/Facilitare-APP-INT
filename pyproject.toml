[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "informativo"
version = "0.1.0"
description = "Informativo — gestão de informações capturadas em diversos provedores (fontes)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Facilitare" }]
dependencies = ["flask>=3.0", "werkzeug>=3.0"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
prod = ["gunicorn>=21.2"]
postgres = ["psycopg2-binary>=2.9"]

[project.scripts]
informativo-web = "informativo.web.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"informativo" = ["seed_data/*.json"]
"informativo.web" = ["templates/*.html", "static/*.css"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
